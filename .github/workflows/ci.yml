name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Run JS-based actions on Node 24; Node 20 is deprecated on GitHub
  # runners (removal scheduled 2026-09-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy speks/

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=speks --cov-report=term-missing -q

      - name: Build wheel
        run: pip wheel . --no-deps
